<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#34383e"/><stop offset="1" stop-color="#16181b"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0d2236"/><stop offset="1" stop-color="#0a1522"/></linearGradient>
    <linearGradient id="mic" x1="0" x2="1"><stop offset="0" stop-color="#1b1d21"/><stop offset=".5" stop-color="#40454c"/><stop offset="1" stop-color="#15171a"/></linearGradient>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="380" rx="170" ry="9" fill="url(#sh)"/>
  <!-- wall housing -->
  <rect x="34" y="40" width="332" height="330" rx="16" fill="url(#plate)" stroke="#4a5058"/>
  <!-- touchscreen bezel -->
  <rect x="54" y="62" width="216" height="146" rx="8" fill="#0b0c0e" stroke="#3a3f46"/>
  <rect x="62" y="70" width="200" height="130" rx="4" fill="url(#glass)"/>
  <text x="72" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#e9edf1">BUILDING 1 · OUTDOOR PAGING</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <rect x="70" y="94" width="56" height="24" rx="4" fill="#c8a84b"/><text x="98" y="110" fill="#0d1b2a">1A</text>
    <rect x="132" y="94" width="56" height="24" rx="4" fill="#1d3a57"/><text x="160" y="110" fill="#cfe3f5">1B</text>
    <rect x="194" y="94" width="60" height="24" rx="4" fill="#1d3a57"/><text x="224" y="110" fill="#cfe3f5">2A</text>
    <rect x="70" y="124" width="56" height="24" rx="4" fill="#1d3a57"/><text x="98" y="140" fill="#cfe3f5">2B</text>
    <rect x="132" y="124" width="56" height="24" rx="4" fill="#c8a84b"/><text x="160" y="140" fill="#0d1b2a">3A</text>
    <rect x="194" y="124" width="60" height="24" rx="4" fill="#1d3a57"/><text x="224" y="140" fill="#cfe3f5">3B</text>
    <rect x="70" y="156" width="184" height="34" rx="5" fill="#b8322a"/><text x="162" y="177" fill="#fff" font-size="11">ALL CALL · PUSH TO TALK</text>
  </g>
  <!-- logo strip -->
  <text x="162" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#cfd5db" text-anchor="middle">Q-SYS</text>
  <!-- hook cradle -->
  <rect x="290" y="74" width="56" height="18" rx="5" fill="#0f1012" stroke="#3a3f46"/>
  <!-- handheld mic hanging -->
  <g transform="rotate(4 318 160)">
    <rect x="300" y="84" width="38" height="132" rx="16" fill="url(#mic)" stroke="#4a5058"/>
    <rect x="306" y="92" width="26" height="40" rx="10" fill="#0b0c0e"/>
    <g fill="#2a2d32"><rect x="310" y="98" width="18" height="2"/><rect x="310" y="104" width="18" height="2"/><rect x="310" y="110" width="18" height="2"/><rect x="310" y="116" width="18" height="2"/><rect x="310" y="122" width="18" height="2"/></g>
    <rect x="292" y="148" width="10" height="34" rx="4" fill="#c8a84b"/>
  </g>
  <!-- coiled cord -->
  <path d="M320 218 c-14 6 14 12 0 18 c-14 6 14 12 0 18 c-14 6 14 12 0 18 c-14 6 14 12 0 18 c-14 6 14 12 -10 22 C 290 316, 270 330, 250 336" fill="none" stroke="#0e0f11" stroke-width="5" stroke-linecap="round"/>
  <!-- speaker grille bottom-left -->
  <g fill="#0b0c0e"><circle cx="80" cy="280" r="3"/><circle cx="92" cy="280" r="3"/><circle cx="104" cy="280" r="3"/><circle cx="116" cy="280" r="3"/><circle cx="80" cy="292" r="3"/><circle cx="92" cy="292" r="3"/><circle cx="104" cy="292" r="3"/><circle cx="116" cy="292" r="3"/></g>
</svg>
