<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="flange" cx=".45" cy=".4"><stop offset="0" stop-color="#d9b77a"/><stop offset="1" stop-color="#9c7843"/></radialGradient>
    <linearGradient id="wind" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".5" stop-color="#16181b"/><stop offset="1" stop-color="#26292e"/></linearGradient>
    <pattern id="wraps" width="10" height="200" patternUnits="userSpaceOnUse"><rect width="10" height="200" fill="url(#wind)"/><rect x="8" width="2" height="200" fill="#000" opacity=".45"/></pattern>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="340" rx="170" ry="12" fill="url(#sh)"/>
  <!-- back flange -->
  <ellipse cx="300" cy="200" rx="56" ry="130" fill="#8a6a3a"/>
  <!-- wound cable drum -->
  <rect x="100" y="90" width="200" height="220" fill="url(#wraps)"/>
  <ellipse cx="300" cy="200" rx="46" ry="110" fill="#1d2024"/>
  <!-- front flange -->
  <ellipse cx="100" cy="200" rx="56" ry="130" fill="url(#flange)" stroke="#7a5c2e"/>
  <ellipse cx="100" cy="200" rx="18" ry="42" fill="#5a4320"/>
  <ellipse cx="100" cy="200" rx="9" ry="21" fill="#2c2110"/>
  <!-- tail -->
  <path d="M290 296 C 330 330, 360 330, 380 300" fill="none" stroke="#1a1c1f" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(380 300)"><circle r="7" fill="#1a1c1f"/><circle cx="-2" cy="-2" r="1.6" fill="#e74c3c"/><circle cx="2" cy="-2" r="1.6" fill="#ecf0f1"/><circle cx="-2" cy="2" r="1.6" fill="#2ecc71"/><circle cx="2" cy="2" r="1.6" fill="#111"/></g>
  <text x="102" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#2c2110" text-anchor="middle" transform="rotate(-90 100 200)">BELDEN</text>
</svg>
