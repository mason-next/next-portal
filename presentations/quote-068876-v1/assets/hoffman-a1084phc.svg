<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="front" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#c4c9cf"/></linearGradient>
    <linearGradient id="side" x1="0" x2="1"><stop offset="0" stop-color="#a9afb6"/><stop offset="1" stop-color="#8b9199"/></linearGradient>
    <linearGradient id="top" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7f8f9"/><stop offset="1" stop-color="#d9dde1"/></linearGradient>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="338" rx="150" ry="14" fill="url(#sh)"/>
  <!-- body depth -->
  <path d="M86 92 L130 62 L330 62 L286 92 Z" fill="url(#top)"/>
  <path d="M286 92 L330 62 L330 300 L286 332 Z" fill="url(#side)"/>
  <!-- cover -->
  <rect x="70" y="92" width="216" height="240" rx="10" fill="url(#front)" stroke="#9aa1a9"/>
  <rect x="82" y="104" width="192" height="216" rx="6" fill="none" stroke="#b4bac1"/>
  <!-- hinges -->
  <g fill="#b0b6bd" stroke="#8b9199"><rect x="62" y="124" width="12" height="30" rx="3"/><rect x="62" y="270" width="12" height="30" rx="3"/></g>
  <!-- latches -->
  <g fill="#d4d8dd" stroke="#8b9199"><rect x="280" y="140" width="14" height="34" rx="4"/><rect x="280" y="250" width="14" height="34" rx="4"/></g>
  <g fill="#6c737b"><circle cx="287" cy="157" r="3"/><circle cx="287" cy="267" r="3"/></g>
  <!-- gland at bottom -->
  <g fill="#3a3f45"><rect x="140" y="332" width="20" height="14" rx="2"/><rect x="200" y="332" width="20" height="14" rx="2"/></g>
</svg>
