<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="face" x1="0" x2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset=".45" stop-color="#3a3f46"/><stop offset="1" stop-color="#1c1f23"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#15171a"/><stop offset="1" stop-color="#26292e"/>
    </linearGradient>
    <pattern id="grille" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#24272c"/><circle cx="2.5" cy="2.5" r="1.25" fill="#0c0d0f"/>
    </pattern>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="386" rx="150" ry="9" fill="url(#shadow)"/>
  <!-- front-facing column -->
  <g>
    <rect x="128" y="14" width="46" height="370" rx="9" fill="url(#face)"/>
    <rect x="133" y="26" width="36" height="346" rx="5" fill="url(#grille)"/>
    <rect x="133" y="26" width="36" height="346" rx="5" fill="none" stroke="#000" stroke-opacity=".5"/>
    <rect x="128" y="14" width="46" height="370" rx="9" fill="none" stroke="#4a5058" stroke-width="1.2"/>
    <rect x="131" y="17" width="8" height="364" rx="4" fill="#fff" opacity=".06"/>
    <rect x="141" y="352" width="20" height="6" rx="1.5" fill="#6d747d"/>
    <text x="151" y="357.2" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#16181b" text-anchor="middle">Q-SYS</text>
  </g>
  <!-- profile column on pan/tilt bracket, tilted down -->
  <g transform="rotate(-7 262 200)">
    <rect x="300" y="132" width="16" height="10" rx="2" fill="#2a2d32"/>
    <rect x="300" y="262" width="16" height="10" rx="2" fill="#2a2d32"/>
    <rect x="312" y="118" width="10" height="168" rx="3" fill="#30343a" stroke="#4a5058"/>
    <circle cx="317" cy="137" r="4" fill="#8a9099"/><circle cx="317" cy="267" r="4" fill="#8a9099"/>
    <rect x="252" y="20" width="22" height="366" rx="8" fill="url(#side)"/>
    <rect x="270" y="20" width="30" height="366" rx="8" fill="url(#face)"/>
    <rect x="252" y="20" width="48" height="366" rx="8" fill="none" stroke="#4a5058" stroke-width="1.2"/>
    <rect x="276" y="60" width="18" height="6" rx="2" fill="#1a1c20"/>
    <rect x="276" y="340" width="18" height="6" rx="2" fill="#1a1c20"/>
    <rect x="272" y="366" width="26" height="12" rx="3" fill="#121316" stroke="#3b4047"/>
  </g>
</svg>
